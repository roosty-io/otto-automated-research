name: Browser Tests

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of browser test to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - full

  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  browser-tests:
    name: Browser Automation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run browser health check
        run: |
          npx tsx scripts/test-browser.ts
        env:
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          NODE_ENV: test

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-artifacts
          path: |
            screenshots/
            logs/
          retention-days: 7

  browserless-health:
    name: Browserless Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check browserless connection
        run: |
          node -e "
            const { checkBrowserlessHealth } = require('./lib/automation/browserless');
            checkBrowserlessHealth().then(result => {
              console.log('Health check result:', JSON.stringify(result, null, 2));
              if (!result.healthy) {
                process.exit(1);
              }
            });
          "
        env:
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
