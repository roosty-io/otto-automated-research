# Supabase Configuration for PPME
# See: https://supabase.com/docs/guides/cli/config

[project]
id = "ppme"

[api]
# Port to use for the API URL
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API endpoints.
schemas = ["public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["extensions"]
# Maximum number of rows to return from a single API call
max_rows = 1000

[db]
# Port to use for the local database URL
port = 54322
# Major version of PostgreSQL
major_version = 15

[studio]
# Port to use for Supabase Studio
port = 54323

[inbucket]
# Port to use for the email testing server web interface
port = 54324

[storage]
# Maximum allowed file upload size
file_size_limit = "50MiB"

[auth]
# The base URL of your website
site_url = "http://localhost:3000"
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication
additional_redirect_urls = ["https://localhost:3000"]
# JWT expiration time in seconds
jwt_expiry = 3600
# Enable anonymous sign-ins
enable_anonymous_sign_ins = false

[auth.email]
# Allow/disallow new user signups via email
enable_signup = true
# If enabled, a user will be required to confirm any email change
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in
enable_confirmations = false

# Edge Functions configuration
[functions.process-jobs]
verify_jwt = false

[functions.update-store-health]
verify_jwt = false

[functions.calculate-ceilings]
verify_jwt = false

[analytics]
enabled = false
